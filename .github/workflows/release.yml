name: Release

# Automatic release pipeline (replaces the old manual workflow_dispatch).
#
# Flow (fully automatic after the NPM_TOKEN secret is configured):
#   1. Every push to `main` runs release-please. If the commits since the last
#      release include `fix:` / `feat:` / BREAKING CHANGE (conventional
#      commits), it opens (or updates) a release PR — "chore(main): release
#      vX.Y.Z" — with the version bump + CHANGELOG.md.
#   2. Merging that release PR pushes the bump to `main`, release-please
#      creates the GitHub Release + `vX.Y.Z` tag, and the publish job in this
#      same run builds, tests, and publishes the package to npm.
#
# Requirements:
#   - Repo secret `NPM_TOKEN`: an npm access token (Automation or Publish
#     scope) for the package's publishing account. Add it under
#     Settings → Secrets and variables → Actions.
#   - Commit messages on `main` should follow conventional commits
#     (e.g. `fix(sdk): ...`, `feat(sdk): ...`, `chore: ...`) so the next
#     version is chosen correctly. `BREAKING CHANGE:` in the body bumps major.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          package-name: lazypock

      # ── Only runs when release-please just created a release (release PR
      #    merged) — checkout the released code and publish it to npm. ──
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ steps.release.outputs.release_created }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ steps.release.outputs.release_created }}
        run: bun run typecheck

      - name: Smoke test (build + runtime + type-level)
        if: ${{ steps.release.outputs.release_created }}
        run: bun run smoke

      - name: Configure npm auth
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" \
            > ~/.npmrc

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
